[project]
name = "popoff"
version = "0.1.0"
description = "Population-aware CRISPR off-target audit"
requires-python = ">=3.11"
dependencies = ["certifi", "fastapi", "uvicorn", "httpx"]

[project.optional-dependencies]
nat = ["nvidia-nat"]

[project.scripts]
popoff = "popoff.cli:main"

[project.entry-points."nat.plugins"]
popoff = "popoff.nat_register"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
popoff = ["cfd_tables.json"]
